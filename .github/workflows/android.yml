name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Derle ve APK üret
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle hazırla
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew çalıştırılabilir olsun
        run: chmod +x ./gradlew

      - name: Debug APK derle
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee derleme.log

      - name: Birim testleri
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee -a derleme.log

      # Kırılınca derleyici hatalarını log'un en sonuna yazıyoruz. Gradle'ın
      # yığın izi yüzlerce satır sürüyor ve asıl "e:" satırları ortada kalıyor;
      # sebebi bulmak için bütün log'u taramak gerekiyordu.
      - name: Hataları özetle
        if: failure()
        run: |
          echo "===== DERLEME HATALARI ====="
          grep -E "^e: |^w: .*error|FAILED$|^\s+> " derleme.log | head -60 || true
          echo "===== TEST HATALARI ====="
          grep -E "FAILED|AssertionError|tests completed" derleme.log | head -40 || true

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: merkez-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
