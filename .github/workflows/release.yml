name: Derle ve yayınla

on:
  push:
    branches: ["claude/**", "main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Derle, test et, imzalı APK yayınla
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle hazırla
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew çalıştırılabilir olsun
        run: chmod +x ./gradlew

      # Derleme ve testler burada, ayrı bir iş akışında değil. İkiye bölünmüş
      # olması her kırılmada iki ayrı "Run failed" bildirimi üretiyordu ve
      # aynı kodu iki kez derliyordu.
      - name: Derle ve testleri çalıştır
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee derleme.log

      # Anahtar eksikse sessizce atlamıyoruz: yeşil tik alıp hiçbir şey
      # yayınlamamak, sorunu saatlerce görünmez kılıyor.
      - name: İmzalama anahtarını çöz
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          # Teşhis için: aynı isimler "Variables" sekmesine eklenmiş olabilir.
          KEYSTORE_AS_VAR: ${{ vars.SIGNING_KEYSTORE_BASE64 }}
          PASSWORD_AS_VAR: ${{ vars.SIGNING_STORE_PASSWORD }}
        run: |
          echo "secrets.SIGNING_KEYSTORE_BASE64 uzunluğu: ${#KEYSTORE_BASE64}"
          echo "secrets.SIGNING_STORE_PASSWORD  uzunluğu: ${#STORE_PASSWORD}"
          echo "vars.SIGNING_KEYSTORE_BASE64    uzunluğu: ${#KEYSTORE_AS_VAR}"
          echo "vars.SIGNING_STORE_PASSWORD     uzunluğu: ${#PASSWORD_AS_VAR}"

          if [ -z "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_AS_VAR" ]; then
            echo "::warning::Değerler 'Variables' sekmesine eklenmiş, 'Secrets' sekmesine değil. Variables'taki kayıtları silip Secrets sekmesinden ekleyin."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Teşhis tamamlandı: anahtar eksikse artık işi kırmızıya boyamıyoruz,
          # uyarı verip sürümü atlıyoruz. Secret eklendiği anda sonraki push yayınlar.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::warning::İmzalama secret'ları eksik; sürüm yayınlanmadı. https://github.com/AhmetYuksel5/Myuygulama/settings/secrets/actions adresinde Repository secrets altına SIGNING_KEYSTORE_BASE64 ve SIGNING_STORE_PASSWORD ekleyin."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Yapıştırırken araya giren satır sonları base64'ü bozar; temizliyoruz.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/merkez-release.jks"

          if [ ! -s "$RUNNER_TEMP/merkez-release.jks" ]; then
            echo "::error::Anahtar çözülemedi. base64 metni eksik kopyalanmış olabilir."
            exit 1
          fi
          echo "Anahtar dosyası boyutu: $(stat -c%s "$RUNNER_TEMP/merkez-release.jks") bayt (beklenen 4376)"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: İmzalı APK derle
        if: steps.keystore.outputs.ready == 'true'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/merkez-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: merkez
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee -a derleme.log

      - name: APK'yı adlandır
        if: steps.keystore.outputs.ready == 'true'
        run: |
          mkdir -p yayin
          cp app/build/outputs/apk/release/app-release.apk "yayin/merkez-0.${{ github.run_number }}.apk"

      - name: Sürümü yayınla
        if: steps.keystore.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: Merkez 0.${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}
          files: yayin/merkez-0.${{ github.run_number }}.apk
          make_latest: true

      # Kırılınca hataları log'un en sonuna yazıyoruz. Gradle'ın yığın izi
      # yüzlerce satır sürüyor ve asıl "e:" satırları ortada kalıyor. Adım
      # en sonda: hangi aşama kırılırsa kırılsın özet çıksın.
      - name: Hataları özetle
        if: failure()
        run: |
          echo "===== NE KIRILDI ====="
          grep -E "^\* What went wrong:|^Execution failed for task|^e: |FAILED$" derleme.log |
            head -40 || true
          echo "===== AYRINTI ====="
          grep -E "^\s+> |AssertionError|tests completed" derleme.log | head -40 || true
          echo "===== BELLEK / R8 ====="
          grep -iE "OutOfMemory|GC overhead|heap space|daemon has terminated|Caused by" \
            derleme.log | head -20 || true

      - name: Anahtarı sil
        if: always()
        run: rm -f "$RUNNER_TEMP/merkez-release.jks"
