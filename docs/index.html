<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<!--
  viewport-fit=cover: iPhone'da ana ekrandan açılınca uygulama çentiğin
  altına kadar uzanıyor; kenar boşluklarını CSS'teki güvenli alan
  değişkenleriyle veriyoruz.
-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arapça Kitap">
<meta name="theme-color" content="#faf7f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
<title>Arapça Kitap Okuyucu</title>
</head>
<body>

<!--
  İlk çizim gelene kadar duran yazı. Ayırt etmeye yarıyor: bu yazıyı
  görüyorsan sayfa geldi ama betik çalışmadı; hiçbir şey görmüyorsan
  sayfanın kendisi gelmemiş.
-->
<main id="ekran"><p class="bos">Yükleniyor…</p></main>

<nav id="cubuk">
  <button data-git="kitaplik" class="secili">Kitaplık</button>
  <button data-git="deste">Liste</button>
  <button data-git="ayarlar">Ayarlar</button>
</nav>

<!-- Seçim kutusu. Android'deki renk kutusunun aynısı. -->
<div id="perde" hidden>
  <div id="kutu" role="dialog" aria-modal="true">
    <p id="kutu-secim"></p>
    <p id="kutu-ceviri" class="sonuc"></p>
    <div id="kutu-notlar"></div>
    <div id="kutu-kalemler"></div>
    <!--
      Ayrıntı ile Soru sor yan yana, ikisi de aynı düğme biçiminde. Soru
      en altta düğmesiz bir yazıydı, kartın altında kaybolup gidiyordu.
      Cümlede Ayrıntı gizleniyor, Soru sor tek başına kalıyor.
    -->
    <div id="kutu-dugmeler">
      <button id="kutu-ayrinti" class="tonlu">Ayrıntı</button>
      <button id="kutu-sor" class="tonlu">Soru sor</button>
    </div>
    <div id="kutu-soru">
      <div id="kutu-soru-alani" hidden>
        <input id="kutu-soru-metin" placeholder="Sorun…" autocomplete="off">
        <button id="kutu-soru-gonder" class="tonlu">Sor</button>
      </div>
      <div id="kutu-cevap" class="sonuc"></div>
    </div>
    <div id="kutu-not" class="sonuc"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
